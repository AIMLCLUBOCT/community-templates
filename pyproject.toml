[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "community-templates"
version = "0.2.0"
description = "Curated starter templates, research frameworks, and production inference recipes for AIML Club."
readme = "README.md"
authors = [{ name = "AIML Club Developers", email = "aimlcluboct@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv", "*.ipynb", "workshop-template/notebooks/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "UP036", "F401"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "inference-container-template/tests"]
python_files = ["test_*.py"]
