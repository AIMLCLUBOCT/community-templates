name: Validate Community Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linting & Testing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest httpx fastapi pydantic prometheus-client numpy

      - name: Run Ruff Lint Checks
        run: |
          ruff check .

      - name: Validate Python Syntax across Templates
        run: |
          python -m compileall -q project-template/src
          python -m compileall -q research-template/src
          python -m compileall -q workshop-template/notebooks
          python -m compileall -q inference-container-template/app

      - name: Run Inference Test Suite
        run: |
          pytest inference-container-template/tests -v
